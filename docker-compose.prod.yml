version: '3.8'

services:
  # Nginx Reverse Proxy with SSL/TLS
  nginx:
    image: nginx:alpine
    container_name: webssh-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./html:/usr/share/nginx/html:ro
    networks:
      - webssh-network
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WebSSH Backend - WebSocket SSH Bridge
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: webssh-backend
    hostname: webssh-backend
    expose:
      - "8000"
    environment:
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      - ~/.ssh:/home/webssh/.ssh:ro
    networks:
      - webssh-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=2)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.webssh.description=WebSSH Backend Server"
      - "com.webssh.version=1.0.0"

  # WebSSH Frontend - Web Interface
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webssh-frontend
    hostname: webssh-frontend
    expose:
      - "8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - BACKEND_URL=wss://webssh.example.com/ws
    networks:
      - webssh-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.webssh.description=WebSSH Frontend"
      - "com.webssh.version=1.0.0"

networks:
  webssh-network:
    driver: bridge
    name: webssh-network
    ipam:
      config:
        - subnet: 172.25.0.0/16
